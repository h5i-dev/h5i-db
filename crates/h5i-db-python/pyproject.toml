[build-system]
requires = ["maturin>=1.6,<2.0"]
build-backend = "maturin"

[project]
name = "h5i-db"
description = "Embedded versioned time-series database for quant workloads and AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["pyarrow>=14"]
dynamic = ["version"]

[project.optional-dependencies]
# TPE parameter search only. Everything else, including seeded random search,
# works without it, so it stays an extra rather than a dependency.
optuna = ["optuna>=3.4"]
# The live websocket recorder (`h5i_db.capture`). An extra because most users
# read archives somebody else recorded, and none of them should have to build a
# TLS stack to do it. Every one of these is imported inside the function that
# needs it, so `import h5i_db.capture` works without them.
capture = ["websockets>=12", "cryptography>=42", "lz4>=4"]

[project.scripts]
h5i-backtest = "h5i_db.backtest:main"
h5i-venues = "h5i_db.venues.__main__:main"
h5i-capture = "h5i_db.capture.__main__:main"

[tool.maturin]
module-name = "h5i_db._native"
python-source = "python"
features = ["pyo3/extension-module"]
# The workspace release profile is panic = "abort", which would make any
# panic kill the host interpreter. Wheels therefore build with the `wheel`
# profile (release + panic = "unwind"; see the workspace Cargo.toml).
# Canonical build command: maturin build --profile wheel
# (plain `maturin build` picks this profile up from here; do NOT pass
# --release, which would override it back to the abort profile).
profile = "wheel"
