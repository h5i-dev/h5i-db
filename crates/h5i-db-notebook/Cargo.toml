[package]
name = "h5i-db-notebook"
description = "In-terminal Jupyter-compatible notebook for h5i-db: nbformat documents, kernel client, agent CLI, TUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

libc = "0.2"

jupyter-protocol = "2.0.2"
jupyter-zmq-client = { version = "1.0.1", default-features = false, features = ["tokio-runtime", "ring"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
libc = "0.2"
