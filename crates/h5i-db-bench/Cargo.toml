[package]
name = "h5i-db-bench"
description = "Benchmark harness for h5i-db"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
# This crate ships two binaries, so `cargo run -p h5i-db-bench` would otherwise
# be ambiguous and fail. The query harness is the one CI, the README and
# benchmarks/RESULTS.md all invoke that way; the fork harness is opt-in via
# `--bin h5i-db-fork-bench`.
default-run = "h5i-db-bench"

[[bin]]
name = "h5i-db-bench"
path = "src/main.rs"

# Fork lifecycle microbenchmarks (ROADMAP X-D1). A separate binary because it
# measures branch primitives rather than query workloads, and wants to run at a
# different scale.
[[bin]]
name = "h5i-db-fork-bench"
path = "src/fork_bench.rs"

[dependencies]
h5i-db-core = { workspace = true }
h5i-db-query = { workspace = true }
arrow = { workspace = true }
datafusion = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }
