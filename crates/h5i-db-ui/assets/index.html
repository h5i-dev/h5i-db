:root {
  --bg: #0a0c10; --surface: #12161c; --surface-2: #1a1f26; --elev: #232931;
  --border: #2a3138; --border-strong: #3a424b;
  --text: #f6f7f9; --muted: #abb3bf; --dim: #6b7785;
  --accent: #42e2d0; --accent-hi: #7cefe0;
  --accent-bg: rgba(66,226,208,.14); --accent-glow: rgba(66,226,208,.32);
  --green: #5ee2a0; --orange: #f0a050; --red: #ff6b6b; --violet: #b48bd9;
  --font-ui: "Space Grotesk", system-ui, -apple-system, sans-serif;
  --font-mono: "Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --rail-w: 232px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: var(--font-ui); font-size: 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------------------------------------------------------------- shell
   A fixed frame that owns the viewport: header, attention rail, panes that
   scroll internally. The page itself never scrolls. */
.app { display: flex; flex-direction: column; height: 100vh; }
header { display: flex; align-items: center; gap: 16px; padding: 0 16px;
  height: 48px; flex: none; background: var(--surface);
  border-bottom: 1px solid var(--border); }
header .logo { font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
header .logo b { color: var(--accent); }
header .logo span { color: var(--dim); font-weight: 400; }

  min-height: 0; }

/* ---------------------------------------------------------------- rail

.tag.replace_range, .tag.delete_range { color: var(--red); }
.tag.restore { color: var(--violet); } .tag.compact { color: var(--muted); }

.tag.expired { color: var(--dim); }

/* ---------------------------------------------------------------- forks
   One status dot per fork (conflict > working > ahead > idle), tree glyphs

.st.ahead { color: var(--accent); } .st.idle { color: var(--dim); }

.cmdline { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted);
  background: var(--bg); border-radius: 5px; padding: 8px 10px; margin-top: 6px;
  overflow-x: auto; white-space: nowrap; cursor: copy; }
.cmdline:hover { color: var(--text); }
.subnav { display: flex; gap: 4px; margin: 0 0 16px; border-bottom: 1px solid var(--line); }
.subnav button { border: 0; border-bottom: 2px solid transparent; background: transparent;
  color: var(--muted); padding: 8px 10px; font-family: var(--font-mono); cursor: pointer; }
.subnav button.active { color: var(--text); border-color: var(--accent); }
.trial-row { width: 100%; display: grid; grid-template-columns: 14px minmax(0,1fr) auto;
  gap: 9px; align-items: center; border: 0; border-bottom: 1px solid var(--line);
  background: transparent; color: var(--text); padding: 10px 12px; text-align: left;
  font-family: var(--font-mono); cursor: pointer; }
.trial-row:hover, .trial-row.selected { background: var(--elev); }
.trial-row.seen { opacity: .52; }
.trial-state { color: var(--dim); font-size: 10.5px; }
.trial-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
.trial-dot.needs-decision { background: var(--red); }
.trial-dot.failed-warned { background: var(--amber); }
.trial-dot.finished-unseen { background: var(--accent); }
.trial-dot.running { background: var(--blue); }
.experiment-head { display:flex; align-items:center; gap:8px; padding:10px 12px;
  border-bottom:1px solid var(--line); cursor:pointer; }
.experiment-head:hover, .experiment-head.selected { background:var(--elev); }
.experiment-head .nm { min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; }
.metric-positive { color: var(--green); }
.metric-negative { color: var(--red); }

@media (max-width: 960px) {
  .body { grid-template-columns: 1fr; }
  .rail { display: none; }
  main.split { display: block; overflow-y: auto; }
  .pane.lhs { border-right: 0; }
}

<body>
<div class="app">
  <header>
    <div class="logo">h5i-<b>db</b> <span>review</span></div>
    <nav id="nav"></nav>
    <div class="hright">
      <span class="dbpath" id="dbpath"></span>
      <span class="forkchip" id="forkchip" style="display:none"></span>
      <span class="mode ro" id="mode">…</span>
      <span class="livedot" id="livedot">○ connecting</span>
    </div>
  </header>
  <div class="body">
    <aside class="rail" id="rail"></aside>
    <main id="main" class="doc"><div class="wrap"><div class="quiet">loading…</div></div></main>
  </div>
</div>
<script>
"use strict";
// ---------------------------------------------------------------- utilities
const $ = (sel, el) => (el || document).querySelector(sel);
const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
};
const fmtNum = (n) => n == null ? "—" : Number(n).toLocaleString("en-US");
const fmtBytes = (b) => {
  if (b == null) return "—";
  const u = ["B","KiB","MiB","GiB","TiB"]; let i = 0; let v = Number(b);
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return i ? v.toFixed(1) + " " + u[i] : v + " B";
};
const fmtTs = (ns) => ns == null ? "—" : new Date(Number(ns) / 1e6).toISOString().replace("T", " ").slice(0, 19) + "Z";
const fmtAgo = (ns) => {
  if (ns == null) return null;
  const s = (Date.now() * 1e6 - ns) / 1e9;
  if (s < 1) return "now";
  if (s < 60) return Math.floor(s) + "s ago";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
};
// Access token: arrives once as ?token= on the startup URL, persisted for
// the tab so reloads work, then stripped from the address bar. Every API
// call sends it as a bearer header; POSTs add the CSRF header (cross-origin
// pages cannot set either without a CORS preflight, which is never granted).
const TOKEN = (() => {
  const u = new URL(location.href);
  const t = u.searchParams.get("token");
  if (t) {
    sessionStorage.setItem("h5i_token", t);
    u.searchParams.delete("token");
    history.replaceState(null, "", u.pathname + u.search + u.hash);
  }
  return sessionStorage.getItem("h5i_token") || "";
})();
async function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({ "authorization": "Bearer " + TOKEN }, opts.headers);
  if (opts.method && opts.method !== "GET") headers["x-h5i-csrf"] = "1";
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const e = new Error(body.message || res.statusText);
    e.envelope = body;
    throw e;
  }
  return body;
}
const post = (path) => api(path, { method: "POST", headers: {"content-type": "application/json"} });

// ---------------------------------------------------------------- state
let OV = null;               // /api/overview payload
let view = "review";         // current view
let tableSel = null;         // selected table for the tables/history views
let forkSel = null;          // selected fork for the forks view
let experimentSel = null;    // selected study in the experiments view
let trialSel = null;         // selected run id; detail-open is the seen edge
let experimentTab = "attention";
const TRIAL_SEEN = new Set(JSON.parse(localStorage.getItem("h5i_trial_seen") || "[]"));
const trialKey = (t) => `${t.fork}:${t.trial_digest || t.run_id}`;
const trialWarnings = (t) => Array.isArray(t.warnings) ? t.warnings : [];
function markTrialSeen(t) {
  TRIAL_SEEN.add(trialKey(t));
  localStorage.setItem("h5i_trial_seen", JSON.stringify([...TRIAL_SEEN].slice(-5000)));
}
function trialAttention(t) {
  if (t.needs_decision) return { state: "needs-decision", priority: 5 };
  if (t.status === "running") return { state: "running", priority: 2 };
  if (TRIAL_SEEN.has(trialKey(t))) return { state: "seen", priority: 1 };
  if (t.status === "failed" || t.status === "warned" || trialWarnings(t).length)
    return { state: "failed-warned", priority: 4 };
  return { state: "finished-unseen", priority: 3 };
}
function experimentAttention(e) {
  return e.trials.reduce((best, t) => {
    const next = trialAttention(t);
    return next.priority > best.priority ? next : best;
  }, { state: "seen", priority: 1 });
}
function routedTrial(e, t) {
  markTrialSeen(t);
  view = "experiments"; experimentSel = e.id; trialSel = t.run_id;
  render();
}

// ---------------------------------------------------------------- shell
const VIEWS = [
  ["review",   "review"],
  ["experiments","experiments"],
  ["forks",    "forks"],
  ["tables",   "tables"],
  ["history",  "history"],
  ["sql",      "sql"],
  ["snapshots","snapshots"],
];
function renderNav() {
  const nav = $("#nav");
  nav.replaceChildren(...VIEWS.map(([id, label]) => {
    // Roll status up by attention priority, not by count: the badge shows
    // the most urgent thing behind the tab (conflicts outrank activity).
    let badge = null;
    if (id === "review") {
      const pending = OV.plans.filter(p => !p.expired).length;
      if (pending) badge = h("span", { class: "badge" }, String(pending));
    } else if (id === "experiments") {
      const warned = (OV.experiments || []).flatMap(e => e.trials)
        .filter(t => trialWarnings(t).length && !TRIAL_SEEN.has(trialKey(t))).length;
      if (warned) badge = h("span", { class: "badge alert" }, String(warned));
    } else if (id === "forks") {
      const conflicts = (OV.forks || []).filter(f => f.stale_shadows > 0).length;
      const working = (OV.forks || []).filter(f => forkState(f) === "working").length;
      if (conflicts) badge = h("span", { class: "badge alert" }, String(conflicts));
      else if (working) badge = h("span", { class: "badge" }, String(working));
    }
    return h("button", { class: view === id ? "active" : "", onclick: () => { view = id; render(); } },
      label, badge);
  }));
}
async function refresh() {
  const [overview, experimentData] = await Promise.all([
    api("/api/overview"), api("/api/experiments"),
  ]);
  OV = overview;
  OV.experiments = experimentData.experiments || [];
  $("#dbpath").textContent = OV.db;
  const chip = $("#forkchip");
  if (OV.fork) { chip.style.display = ""; chip.textContent = "fork: " + OV.fork; }
  else chip.style.display = "none";
  const mode = $("#mode");
  mode.textContent = OV.allow_mutations ? "mutations allowed" : "read-only";
  mode.className = "mode " + (OV.allow_mutations ? "rw" : "ro");
  if (!tableSel && OV.tables.length) tableSel = OV.tables[0].name;
  if (!experimentSel && OV.experiments.length) experimentSel = OV.experiments[0].id;
  render();
}
function render() {
  renderNav();
  renderRail();
  const main = $("#main");
  main.replaceChildren();
  if (view === "forks" || view === "experiments") {
    main.className = "split";
    if (view === "forks") renderForks(main);
    else renderExperiments(main);
  } else {
    main.className = "doc";
    const wrap = h("div", { class: "wrap" });
    main.append(wrap);
    ({ review: renderReview, tables: renderTables, history: renderHistory,
       sql: renderSql, snapshots: renderSnapshots })[view](wrap);
  }
}

// --------------------------------------------------------- attention rail
// The herdr rollup as a surface: NEEDS YOU (a human must decide) over
// ACTIVE (the system is doing something) over INFO (quiet facts). Clicking
// an item routes to it and marks it seen; seen items dim but stay while
// the condition holds — acknowledgement never hides a live condition.
const RAIL_SEEN = new Set(JSON.parse(sessionStorage.getItem("h5i_rail_seen") || "[]"));
function markSeen(key) {
  RAIL_SEEN.add(key);
  // The set is keyed by condition fingerprints and would otherwise grow for
  // the life of the tab; cap it and let stale keys fall out.
  const arr = [...RAIL_SEEN].slice(-200);
  sessionStorage.setItem("h5i_rail_seen", JSON.stringify(arr));
}
const ACTIVE_TABLE_NS = 60e9;
function railModel() {
  const needs = [], active = [], info = [];
  const forks = OV.forks || [];
  for (const p of OV.plans.filter(p => !p.expired)) {
    needs.push({
      key: `plan:${p.plan_id}:${p.stale}`,
      icon: "●", cls: p.stale ? "st working" : "st ahead",
      label: `${p.op.replace("_", " ")} ${p.table}`,
      meta: p.stale ? "stale" : fmtAgo(p.created_at_ns),
      go: () => { view = "review"; render(); },
    });
  }
  for (const f of forks.filter(f => f.stale_shadows > 0)) {
    needs.push({
      key: `conflict:${f.name}:${f.stale_shadows}`,
      icon: "◉", cls: "st conflict",
      label: f.name,
      meta: f.stale_shadows + " conflict" + (f.stale_shadows > 1 ? "s" : ""),
      go: () => { view = "forks"; forkSel = f.name; render(); },
    });
  }
  for (const f of forks.filter(f => forkState(f) === "working")
      .sort((a, b) => b.last_write_ns - a.last_write_ns)) {
    active.push({
      key: `working:${f.name}`, spin: true, cls: "st working",
      label: f.name, meta: fmtAgo(f.last_write_ns),
      go: () => { view = "forks"; forkSel = f.name; render(); },
    });
  }
  const routed = (OV.experiments || []).flatMap(e => e.trials.map(t => ({ e, t })))
    .sort((a, b) => trialAttention(b.t).priority - trialAttention(a.t).priority);
  for (const { e, t } of routed) {
    const attn = trialAttention(t);
    const item = {
      key: `trial:${trialKey(t)}:${attn.state}`,
      icon: attn.state === "needs-decision" ? "◉" : "●",
      spin: attn.state === "running",
      cls: "st " + (attn.state === "failed-warned" ? "conflict"
        : attn.state === "running" ? "working" : "ahead"),
      label: `${e.id} · ${t.trial == null ? t.run_id : "trial " + t.trial}`,
      meta: attn.state.replace("-", " "),
      go: () => routedTrial(e, t),
    };
    if (attn.priority >= 4) needs.push(item);
    else if (attn.priority >= 2) active.push(item);
  }
  const now = Date.now() * 1e6;
  for (const t of OV.tables.filter(t => now - t.committed_at_ns < ACTIVE_TABLE_NS)
      .sort((a, b) => b.committed_at_ns - a.committed_at_ns)) {
    active.push({
      key: `table:${t.name}:${t.version}`,
      icon: "●", cls: "st ahead",
      label: t.name, meta: `v${t.version} · ${fmtAgo(t.committed_at_ns)}`,
      go: () => { view = "tables"; tableSel = t.name; render(); },
    });
  }
  for (const f of forks.filter(f => forkState(f) === "ahead")
      .sort((a, b) => b.bytes_own - a.bytes_own)) {
    info.push({
      key: `ahead:${f.name}:${f.commits_own}`,
      icon: "●", cls: "st ahead",

// ------------------------------------------------------- live event stream
// One SSE subscription (over fetch, so it can carry the bearer token) keeps
// tables / plans / forks current; the server only pushes frames when the
// state actually changed. The dot in the header reports transport state
// honestly — "live" means the stream is open, not that we hope it is.
function setLive(state) {
  const el = $("#livedot");
  if (state === "live") { el.textContent = "● live"; el.className = "livedot on"; }
  else if (state === "connecting") { el.textContent = "○ connecting"; el.className = "livedot"; }
  else { el.textContent = "○ offline — retrying"; el.className = "livedot"; }
}
function applyFrame(f) {
  if (!OV) return;
  OV.plans = f.plans; OV.tables = f.tables; OV.forks = f.forks;
  renderNav();
  renderRail();
  if (view === "forks") { drawForkTree(); renderForkDetail(true); }
}
async function updateExperiments() {
  const data = await api("/api/experiments");
  OV.experiments = data.experiments || [];
  if (experimentSel && !OV.experiments.some(e => e.id === experimentSel)) {
    experimentSel = OV.experiments.length ? OV.experiments[0].id : null;
    trialSel = null;
  }
  renderNav(); renderRail();
  if (view === "experiments") render();
}
async function startLive() {
  for (;;) {
    try {
      setLive("connecting");
      const res = await fetch("/api/events", { headers: { "authorization": "Bearer " + TOKEN } });
      if (!res.ok || !res.body) throw new Error("events " + res.status);
      setLive("live");
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
          const data = chunk.split("\n").filter(l => l.startsWith("data:"))
            .map(l => l.slice(5).trim()).join("\n");
          if (!data) continue;                       // keep-alive comment
          try { applyFrame(JSON.parse(data)); } catch (_) { /* partial frame */ }
        }
      }
    } catch (_) { /* fall through to retry */ }
    setLive("retry");
    await new Promise(r => setTimeout(r, 3000));
  }
}

// ---------------------------------------------------------------- forks
// One glanceable status per fork, rolled up from what the metadata proves:
//   conflict — the base moved under a shadowed table; promote will CAS-fail
//   working  — the fork committed within the last 15 s
//   ahead    — it holds unpromoted commits, quiet right now
//   idle     — forked, never wrote
const ACTIVE_NS = 15e9;
function forkState(f) {
  if (f.stale_shadows > 0) return "conflict";
  if (f.last_write_ns != null && Date.now() * 1e6 - f.last_write_ns < ACTIVE_NS) return "working";
  if (f.commits_own > 0 || f.tables_created + f.tables_shadowed > 0) return "ahead";
  return "idle";
}
const ST_ICON = { conflict: "◉", working: "●", ahead: "●", idle: "○" };
// Only `working` animates — the braille spinner is the single motion
// primitive, and it stands still under prefers-reduced-motion.
const SPIN = ["⠋","⠙","⠹","⠸","⠼","⠴","⠦","⠧","⠇","⠏"];
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
let spinTick = 0;
if (!REDUCED) setInterval(() => {
  const els = document.querySelectorAll(".spin");
  if (!els.length) return;
  const g = SPIN[++spinTick % SPIN.length];
  for (const el of els) el.textContent = g;
}, 100);
// "…s ago" labels and activity states decay even when no frame arrives.
setInterval(() => {
  if (!OV) return;
  renderNav(); renderRail();
  if (view === "forks") drawForkTree();
}, 8000);

function statusIcon(state) {
  const spin = state === "working" && !REDUCED;
  return h("span", { class: "st " + state + (spin ? " spin" : "") },
    spin ? SPIN[spinTick % SPIN.length] : ST_ICON[state]);
}
// Row meta follows herdr's token rule: missing values and their separators
// vanish rather than rendering as zeros.
function forkMeta(f) {
  const t = [];
  if (f.tables_shadowed) t.push(f.tables_shadowed + " shadowed");
  if (f.tables_created) t.push(f.tables_created + " created");
  if (f.commits_own) t.push("+" + f.commits_own);
  if (f.bytes_own) t.push(fmtBytes(f.bytes_own) + " own");
  const ago = fmtAgo(f.last_write_ns);
  if (ago) t.push(ago);
  const parts = [t.join(" · ")];
  if (f.stale_shadows) parts.push(h("span", { class: "hot" },
    (t.length ? " · " : "") + f.stale_shadows + " conflict" + (f.stale_shadows > 1 ? "s" : "")));
  return parts;
}
// Depth-first rows with connected branch glyphs; the base database is the
// root. Lineage uses the recorded parent, falling back to top-level when a
// parent is gone.
function forkTreeRows(forks) {
  const names = new Set(forks.map(f => f.name));
  const kids = new Map();
  const roots = [];
  for (const f of forks) {
    if (f.parent && names.has(f.parent)) {
      if (!kids.has(f.parent)) kids.set(f.parent, []);
      kids.get(f.parent).push(f);
    } else roots.push(f);
  }
  const rows = [];
  const walk = (f, prefix, childPrefix) => {
    rows.push({ f, prefix });
    const c = kids.get(f.name) || [];
    c.forEach((k, i) => {
      const last = i === c.length - 1;
      walk(k, childPrefix + (last ? "└─ " : "├─ "), childPrefix + (last ? "   " : "│  "));
    });
  };
  roots.forEach((f, i) => {
    const last = i === roots.length - 1;
    walk(f, last ? "└─ " : "├─ ", last ? "   " : "│  ");
  });
  return rows;
}

let forkTreeBox = null;
let forkDetailBox = null;
function renderForks(main) {

  const forks = OV.forks || [];
  const counts = { conflict: 0, working: 0, ahead: 0, idle: 0 };
  let own = 0, pinned = 0;
  for (const f of forks) { counts[forkState(f)]++; own += f.bytes_own; pinned += f.bytes_pinned; }
  const stats = h("div", { class: "fstats" },
    h("span", {}, h("b", {}, String(forks.length)), " fork" + (forks.length === 1 ? "" : "s")),
    counts.conflict ? h("span", { style: "color:var(--red)" }, String(counts.conflict) + " conflict") : null,
    counts.working ? h("span", { style: "color:var(--orange)" }, String(counts.working) + " working") : null,
    counts.ahead ? h("span", { style: "color:var(--accent)" }, String(counts.ahead) + " ahead") : null,
    counts.idle ? h("span", {}, String(counts.idle) + " idle") : null,
    own ? h("span", {}, h("b", {}, fmtBytes(own)), " fork-owned") : null,

  const tree = h("div", { class: "ftree" });
  tree.append(h("div", { class: "frow base" },

  for (const { f, prefix } of forkTreeRows(forks)) {
    const state = forkState(f);

      h("span", { class: "meta" }, forkMeta(f))));
  }
  forkTreeBox.replaceChildren(h("p", { class: "micro" }, "forks — live branch monitor"), stats, tree);
  if (!forks.length) forkTreeBox.append(h("div", { class: "quiet" },
    "No forks. `h5i-db fork create " + OV.db + " <name>` gives an agent a fully " +
    "writable copy of the database in O(1) — one JSON object, nothing copied."));
}

  const f = (OV.forks || []).find(x => x.name === name);
  const state = f ? forkState(f) : "idle";
  const info = d.info, diff = d.diff;

      "forked " + fmtTs(info.created_at_ns))));
  if (info.note) bits.push(h("div", { class: "hintline" }, info.note));
  bits.push(h("div", { class: "kv" },
    info.parent ? h("span", { class: "k" }, "parent") : null,
    info.parent ? h("span", {}, h("a", { class: "vlink", onclick: () => {
      forkSel = info.parent; drawForkTree(); renderForkDetail();
    } }, info.parent)) : null,
    h("span", { class: "k" }, "depth"), h("span", {}, String(info.depth || 0)),
    info.as_of_ns ? h("span", { class: "k" }, "as of") : null,
    info.as_of_ns ? h("span", {}, fmtTs(info.as_of_ns)) : null,
    h("span", { class: "k" }, "pinned tables"), h("span", {}, String(Object.keys(info.pins || {}).length)),
    f ? h("span", { class: "k" }, "fork-owned bytes") : null,
    f ? h("span", {}, fmtBytes(f.bytes_own)) : null,
    f ? h("span", { class: "k" }, "holds back in base") : null,
    f ? h("span", {}, fmtBytes(f.bytes_pinned)) : null,
  ));
  const meta = info.user_meta || {};
  if (Object.keys(meta).length) {
    bits.push(h("p", { class: "micro" }, "agent metadata"));
    bits.push(h("div", { class: "kv" }, Object.entries(meta).map(([k, v]) => [
      h("span", { class: "k" }, k),
      h("span", {}, typeof v === "string" ? v : JSON.stringify(v)),
    ]).flat()));
  }
  const tables = (diff && diff.tables) || [];
  if (tables.length) {
    bits.push(h("p", { class: "micro" }, "tables the fork touched"));
    const t = h("table", { class: "grid" });
    t.append(h("tr", {}, ["table", "kind", "commits", "rows", "own size", "base"].map(x => h("th", {}, x))));
    for (const td of tables) {
      const shadowed = td.kind === "shadowed";
      t.append(h("tr", {},
        h("td", {}, td.table),
        h("td", {}, h("span", { class: "tag " + td.kind }, td.kind)),
        h("td", { class: "num" }, "+" + td.fork_versions),
        h("td", { class: "num" }, shadowed
          ? fmtNum(td.rows_base) + " → " + fmtNum(td.rows_fork) : fmtNum(td.rows_fork)),
        h("td", { class: "num" }, fmtBytes(td.bytes_fork)),
        h("td", {}, !shadowed ? "—" : td.base_moved
          ? h("span", { style: "color:" + (td.base_moved_by_compaction_only ? "var(--orange)" : "var(--red)") },
              td.base_moved_by_compaction_only
                ? `moved v${td.base_sequence} → v${td.base_head_sequence} (compaction only)`
                : `moved v${td.base_sequence} → v${td.base_head_sequence} — promote will conflict`)
          : h("span", { style: "color:var(--dim)" }, "v" + td.base_sequence + " ✓"))));
    }
    bits.push(h("div", { class: "scroll-x" }, t));
  } else {
    bits.push(h("div", { class: "quiet" }, "the fork has not written anything yet — it reads base data through its pins"));
  }
  const pins = Object.values(info.pins || {});
  if (pins.length) {
    bits.push(h("p", { class: "micro" }, "pins (base versions this fork holds)"));
    const shown = pins.slice(0, 12);
    bits.push(h("div", { class: "kv" },
      shown.map(p => [h("span", { class: "k" }, p.table_name), h("span", {}, "v" + p.sequence)]).flat(),
      pins.length > shown.length ? h("span", { class: "k" }, "…") : null,
      pins.length > shown.length ? h("span", {}, (pins.length - shown.length) + " more") : null));
  }
  // The UI stays read-only; the CLI is the mutation surface. Click to copy.
  bits.push(h("p", { class: "micro" }, "act from the cli — click to copy"));
  const cmd = (text) => h("div", { class: "cmdline", title: "copy",
    onclick: (e) => { navigator.clipboard.writeText(text); e.target.style.color = "var(--accent)";
      setTimeout(() => { e.target.style.color = ""; }, 400); } }, text);
  const firstTable = tables.length ? tables[0].table : "<table>";
  bits.push(cmd(`h5i-db fork promote ${OV.db} ${name} --table ${firstTable}`));
  bits.push(cmd(`h5i-db fork drop ${OV.db} ${name}`));
  bits.push(cmd(`h5i-db query ${OV.db} "SELECT __fork, count(*) FROM forks('${firstTable === "<table>" ? (OV.tables[0] || {}).name || "<table>" : firstTable}') GROUP BY __fork"`));
  card.replaceChildren(...bits);
}

// ---------------------------------------------------------------- tables
function renderTables(main) {
  main.append(h("p", { class: "micro" }, "tables"));
  const t = h("table", { class: "grid" });
  t.append(h("tr", {},
    ["table", "head", "rows", "size", "segments", "time range", "last op"].map(x => h("th", {}, x))));
  for (const tb of OV.tables) {
    t.append(h("tr", { class: "click" + (tb.name === tableSel ? " sel" : ""), onclick: () => { tableSel = tb.name; render(); } },
      h("td", {}, tb.name),
      h("td", { class: "num" }, "v" + tb.version),
      h("td", { class: "num" }, fmtNum(tb.rows)),
      h("td", { class: "num" }, fmtBytes(tb.bytes)),
      h("td", { class: "num" }, String(tb.segments)),
      h("td", {}, tb.time_range ? `${tb.time_range[0]} → ${tb.time_range[1]}` : "—"),
      h("td", {}, h("span", { class: "tag " + tb.op }, tb.op)),
    ));
  }
  main.append(h("div", { class: "card scroll-x" }, t));
  if (!tableSel) return;
  const schemaCard = h("div", { class: "card" }, h("p", { class: "micro" }, `schema — ${tableSel}`));
  const sampleCard = h("div", { class: "card" }, h("p", { class: "micro" }, `sample — ${tableSel}`));
  main.append(h("div", { class: "cols" }, schemaCard, sampleCard));
  api(`/api/table/${encodeURIComponent(tableSel)}`).then(d => {
    const st = h("table", { class: "grid" });
    st.append(h("tr", {}, ["column", "type", "nullable", ""].map(x => h("th", {}, x))));
    for (const f of d.schema) {
      st.append(h("tr", {},
        h("td", {}, f.name), h("td", {}, f.type), h("td", {}, f.nullable ? "yes" : "no"),
        h("td", {}, f.name === d.time_column ? h("span", { class: "tag planned" }, "time index") : "")));
    }
    schemaCard.append(h("div", { class: "scroll-x" }, st));
  }).catch(e => schemaCard.append(errline(e)));
  api(`/api/table/${encodeURIComponent(tableSel)}/sample?rows=20`).then(d => {
    sampleCard.append(dataGrid(d));
  }).catch(e => sampleCard.append(errline(e)));
}

// ---------------------------------------------------------------- history
function renderHistory(main) {
  const sel = h("select", { onchange: (e) => { tableSel = e.target.value; render(); } },
    OV.tables.map(tb => {
      const o = h("option", { value: tb.name }, tb.name);
      if (tb.name === tableSel) o.selected = true;
      return o;
    }));
  main.append(h("div", { class: "difbar" }, h("span", { class: "micro", style: "margin:0" }, "version timeline"), sel));
  if (!tableSel) { main.append(h("div", { class: "quiet" }, "no tables")); return; }
  const timeline = h("div", { class: "card scroll-x" });
  const diffCard = h("div", { class: "card" }, h("div", { class: "quiet" },
    "pick two versions (click = from, shift-click = to) to diff"));
  main.append(timeline, diffCard);
  let from = null, to = null;
  api(`/api/table/${encodeURIComponent(tableSel)}`).then(d => {
    const t = h("table", { class: "grid" });
    t.append(h("tr", {}, ["v", "op", "mode", "committed", "rows", "size", "segs", "note"].map(x => h("th", {}, x))));
    for (const v of [...d.versions].reverse()) {
      const tr = h("tr", { class: "click", onclick: (e) => {
        if (e.shiftKey) to = v.version; else from = v.version;
        if (from != null && to != null && from !== to) loadDiff();
        [...t.rows].forEach(r => r.classList.remove("sel"));
        tr.classList.add("sel");
      }},
        h("td", { class: "num" }, h("a", { class: "vlink" }, "v" + v.version)),
        h("td", {}, h("span", { class: "tag " + v.op }, v.op)),
        h("td", {}, v.execution_mode === "planned"
          ? h("span", { class: "tag planned", title: "went through plan review; hash " + (v.plan_hash || "").slice(0, 12) }, "planned")
          : h("span", { class: "tag" }, v.execution_mode || "—")),
        h("td", {}, fmtTs(v.committed_at_ns)),
        h("td", { class: "num" }, fmtNum(v.rows)),
        h("td", { class: "num" }, fmtBytes(v.bytes)),
        h("td", { class: "num" }, String(v.segments)),
        h("td", {}, v.note || ""));
      t.append(tr);
    }
    timeline.replaceChildren(h("p", { class: "micro" },
      `versions of ${tableSel} (newest first)`), t);
  }).catch(e => timeline.replaceChildren(errline(e)));
  async function loadDiff() {
    const d = await api(`/api/table/${encodeURIComponent(tableSel)}/diff?from=${Math.min(from,to)}&to=${Math.max(from,to)}`);
    diffCard.replaceChildren(
      h("p", { class: "micro" }, `diff v${d.from.version} → v${d.to.version}`),
      h("div", { class: "kv" },
        h("span", { class: "k" }, "rows"), h("span", {},
          `${fmtNum(d.from.rows)} → ${fmtNum(d.to.rows)} (${d.rows_delta >= 0 ? "+" : ""}${fmtNum(d.rows_delta)})`),
        h("span", { class: "k" }, "bytes"), h("span", {},
          `${fmtBytes(d.from.bytes)} → ${fmtBytes(d.to.bytes)}`),
        h("span", { class: "k" }, "schema"), h("span", {}, d.schema_changed ?
          h("span", { style: "color:var(--orange)" }, `changed (rev ${d.from.schema_revision} → ${d.to.schema_revision})`) : "unchanged"),
        h("span", { class: "k" }, "segments"), h("span", {},
          `${d.segments.added.length} added, ${d.segments.removed.length} removed, ${d.segments.kept} kept`),
        h("span", { class: "k" }, "produced by"), h("span", {},
          `${d.to.op} (${d.to.execution_mode || "?"})${d.to.note ? " — " + d.to.note : ""}`),
      ));
  }
}

// ---------------------------------------------------------------- sql
let lastSql = "SELECT * FROM h5i('" + "') LIMIT 100";
function renderSql(main) {
  if (OV.tables.length && lastSql.includes("h5i('')")) {
    lastSql = `SELECT * FROM ${OV.tables[0].name} LIMIT 100`;
  }
  main.append(h("p", { class: "micro" }, "sql scratchpad — read-only session, 1 000 row cap"));
  const ta = h("textarea", { class: "sql", spellcheck: "false" });
  ta.value = lastSql;
  const status = h("div", { class: "statusline" });
  const out = h("div");
  const chart = h("canvas", { class: "chart", style: "display:none" });
  const run = async () => {
    lastSql = ta.value;
    status.textContent = "running…";
    out.replaceChildren(); chart.style.display = "none";
    try {
      const r = await api("/api/query", { method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ sql: ta.value }) });
      const scans = (r.scan_metrics || []).map(m =>
        `${m.table}@v${m.version}: ${m.segments_pruned}/${m.segments_total} segments pruned, ${fmtBytes(m.bytes_scheduled)} scheduled`).join("; ");
      status.textContent = `${r.rows.length} rows${r.truncated ? " (truncated at 1 000)" : ""} in ${r.wall_ms.toFixed(1)} ms` + (scans ? ` — ${scans}` : "");
      maybeChart(chart, r);
      out.append(dataGrid(r));
    } catch (e) { status.replaceChildren(); showErr(status, e); }
  };
  ta.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); }
  });
  main.append(h("div", { class: "card" }, ta,
    h("div", { class: "actions", style: "margin-top:8px" },
      h("span", { class: "hintline", style: "margin:6px auto 0 0" },
        "Ctrl+Enter to run — time travel: h5i('table', 42) · asof_join('l','r','ts','ts','symbol') · time_bucket('1m', ts) · vwap(price, size)"),
      h("button", { class: "act primary", onclick: run }, "Run"))));
  main.append(status, chart, h("div", { class: "card scroll-x" }, out));
}
// Draw a line preview when the result looks like (time-ish, numeric, ...).
function maybeChart(canvas, r) {
  if (r.rows.length < 3 || r.schema.length < 2) return;
  const tIdx = r.schema.findIndex(f => /Timestamp|Date/.test(f.type));
  const vIdx = r.schema.findIndex((f, i) => i !== tIdx && /Int|Float|Decimal/.test(f.type));
  if (tIdx < 0 || vIdx < 0) return;
  const pts = r.rows
    .map(row => [Date.parse(row[tIdx]), Number(row[vIdx])])
    .filter(([x, y]) => Number.isFinite(x) && Number.isFinite(y))
    .sort((a, b) => a[0] - b[0]);
  if (pts.length < 3) return;
  canvas.style.display = "block";
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth * dpr, H = 180 * dpr;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const px = (x) => 10 * dpr + (W - 20 * dpr) * (x - x0) / Math.max(1, x1 - x0);
  const py = (y) => H - 14 * dpr - (H - 28 * dpr) * (y - y0) / Math.max(1e-12, y1 - y0);
  ctx.strokeStyle = "#42e2d0"; ctx.lineWidth = 1.5 * dpr; ctx.beginPath();
  pts.forEach(([x, y], i) => i ? ctx.lineTo(px(x), py(y)) : ctx.moveTo(px(x), py(y)));
  ctx.stroke();
  ctx.fillStyle = "#6b7785"; ctx.font = `${10 * dpr}px Space Mono, monospace`;
  ctx.fillText(String(y1.toPrecision(6)), 12 * dpr, 12 * dpr);
  ctx.fillText(String(y0.toPrecision(6)), 12 * dpr, H - 4 * dpr);
  ctx.fillText(r.schema[vIdx].name + " over " + r.schema[tIdx].name, W / 2 - 60 * dpr, 12 * dpr);
}

// ---------------------------------------------------------------- snapshots
function renderSnapshots(main) {
  main.append(h("p", { class: "micro" }, "named snapshots (reproducibility pins & gc roots)"));
  if (!OV.snapshots.length) {
    main.append(h("div", { class: "quiet" },
      "No snapshots. Create one with `h5i-db snapshot create <db> <name>` to pin the exact versions a backtest saw."));
    return;
  }
  for (const s of OV.snapshots) {
    main.append(h("div", { class: "card" },
      h("div", { class: "plan-head" },
        h("span", { class: "title" }, s.name),
        h("span", { style: "margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--dim)" }, fmtTs(s.created_at_ns))),
      s.note ? h("div", { class: "hintline" }, s.note) : null,
      h("div", { class: "kv" }, s.tables.map(t => [
        h("span", { class: "k" }, t.table), h("span", {}, "v" + t.version)]).flat())));
  }
}

// ---------------------------------------------------------------- boot
refresh().then(() => {
  startLive();
  setInterval(() => updateExperiments().catch(() => {}), 30000);
}).catch(e => {
  $("#main").replaceChildren(h("div", { class: "wrap" }, errline(e)));
});
</script>
